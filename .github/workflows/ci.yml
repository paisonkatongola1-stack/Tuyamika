name: ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Syntax check
        run: bin/syntax-check.sh

      - name: Seed demo DB
        run: npm run db:seed

      - name: Smoke test against running server
        run: bin/run-smoke.sh
